org.gradle.jvmargs=-Xmx6G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=false
org.gradle.caching=true
org.gradle.parallel=true
# Kotlin 2.3 incremental compilation mis-resolves same-package classes in
# some plugins (share_plus); full compilation is reliable.
kotlin.incremental=false
